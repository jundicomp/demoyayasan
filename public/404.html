<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SPP Yayasan — Platform SPP</title>
  <script>
    // Trik standar SPA di GitHub Pages. Base path diambil otomatis dari nama repo
    // (mis. /demospp/), lalu path biasa (/demospp/tunggakan) diubah jadi rute hash
    // (/demospp/#/tunggakan) dan redirect balik ke index.html.
    var BASE = '/' + location.pathname.split('/')[1] + '/';
    var full = location.pathname + location.search;
    var rest = full.indexOf(BASE) === 0 ? full.slice(BASE.length) : full.replace(/^\/+/, '');
    location.replace(BASE + '#/' + rest);
  </script>
</head>
<body></body>
</html>
